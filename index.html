<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: white editorial pages, deep-navy "statement" bands with a soft radial glow, product mockups drawn in CSS. */
:root{
  --bg:#F6F8FC;
  --surface:#FFFFFF;
  --ink:#0B1630;
  --muted:#56637F;
  --line:#E2E7F1;
  --navy:#0A1836;
  --navy-2:#142A5C;
  --accent:#2D63F6;
  --accent-soft:#E8EEFF;
  --mint:#14A884;
  --mint-soft:#E2F6F0;
  --amber:#C98A12;
  --amber-soft:#FBF1DC;
  --on-navy:#E9EEFA;
  --on-navy-muted:#A5B2D3;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
  --wrap:1180px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.6vw,3.6rem)}
h2{font-size:clamp(1.55rem,3vw,2.35rem)}
h3{font-size:1.08rem;font-weight:600;line-height:1.3}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.lead{font-size:1.2rem;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:18px;height:2px;background:currentColor;border-radius:2px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 1rem var(--f-body);padding:14px 22px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 22px -10px var(--accent)}
.btn-primary:hover{background:#1F52E0;transform:translateY(-1px)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-light{background:#fff;color:var(--navy)}
.btn-light:hover{transform:translateY(-1px)}
.btn-outline-light{border-color:rgba(255,255,255,.35);color:#fff;background:transparent}
.btn-outline-light:hover{border-color:#fff}
.btn-sm{padding:9px 16px;font-size:.92rem}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}

/* Header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(246,248,252,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.logo b{color:var(--accent);font-weight:700}
.logo svg{width:34px;height:34px}
.nav{display:flex;gap:2px;margin-left:12px}
.nav-item{position:relative}
.nav-btn{font:500 .97rem var(--f-body);background:none;border:0;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:6px}
.nav-btn:hover,.nav-item.open .nav-btn{background:var(--surface)}
.nav-btn.active{color:var(--accent)}
.nav-btn .chev{width:14px;height:14px;transition:transform .2s}
.nav-item.open .chev{transform:rotate(180deg)}
.drop{position:absolute;top:calc(100% + 8px);left:0;min-width:270px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 24px 48px -20px rgba(10,24,54,.28);display:none}
.nav-item.open .drop{display:block}
.drop a{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;text-decoration:none}
.drop a:hover{background:var(--bg)}
.drop a .ic{color:var(--accent);width:20px;height:20px;margin-top:2px}
.drop a span{display:block;font-weight:600;font-size:.95rem}
.drop a small{display:block;color:var(--muted);font-size:.82rem;line-height:1.35}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:600 .8rem var(--f-body);border:0;background:none;padding:6px 10px;border-radius:999px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.link-btn{font:500 .97rem var(--f-body);background:none;border:0;cursor:pointer;color:var(--ink);padding:8px 10px}
.burger{display:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;cursor:pointer;align-items:center;justify-content:center}
.mnav{display:none}
@media (max-width:1060px){
  .nav,.hdr-right .link-btn,.hdr-right .btn{display:none}
  .burger{display:flex}
  .mnav.open{display:block;position:fixed;inset:72px 0 0;background:var(--bg);overflow:auto;padding:16px 24px 40px;z-index:49}
  .mnav h4{font:600 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 6px}
  .mnav a{display:block;padding:10px 0;font-size:1.08rem;text-decoration:none;border-bottom:1px solid var(--line)}
  .mnav .btn-row{margin-top:24px}
}

/* Sections */
main{display:block}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
.sec{padding:88px 0}
.sec-sm{padding:56px 0}
.sec-head{display:grid;gap:14px;margin-bottom:44px;max-width:760px}
.dark{background:radial-gradient(900px 480px at 85% -10%,rgba(45,99,246,.38),transparent 60%),radial-gradient(700px 420px at 0% 110%,rgba(20,168,132,.18),transparent 60%),linear-gradient(180deg,var(--navy),#0C1E46);color:var(--on-navy)}
.dark .lead,.dark .muted{color:var(--on-navy-muted)}
.dark .eyebrow{color:#8FB0FF}
.white{background:var(--surface)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.sec{padding:64px 0}.pill{white-space:normal}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px}
.bg-white .card,.white .card{background:var(--bg)}
.card .ico{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.card p{color:var(--muted);font-size:.98rem}
.dark .card{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
.dark .card p{color:var(--on-navy-muted)}
.dark .card .ico{background:rgba(143,176,255,.14);color:#A9C2FF}

/* Hero */
.hero{padding:72px 0 80px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-220px;top:-200px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(45,99,246,.16),transparent 65%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center;position:relative}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr}}
.hero-copy{display:grid;gap:22px}
.hero-copy .small{color:var(--muted);max-width:56ch}
.aud-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;font-weight:500;text-decoration:none}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.page-hero{padding:72px 0 64px}
.page-hero .hero-copy{max-width:820px}

/* Mockups */
.mock{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 80px -40px rgba(10,24,54,.35);overflow:hidden;font-size:.86rem}
.mock-bar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.mock-bar i{width:10px;height:10px;border-radius:50%;background:#D4DAE6}
.mock-bar span{margin-left:10px;color:var(--muted);font-size:.78rem}
.mock-body{display:grid;grid-template-columns:150px 1fr;min-height:330px}
.mock-side{border-right:1px solid var(--line);padding:16px 12px;display:grid;align-content:start;gap:4px}
.mock-side div{padding:8px 10px;border-radius:8px;color:var(--muted);font-size:.8rem}
.mock-side div.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.mock-main{padding:18px;display:grid;gap:12px;align-content:start}
.mock-tag{position:absolute;right:12px;bottom:12px;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--amber-soft);color:#8A5D05;padding:4px 9px;border-radius:999px}
.bubble{padding:10px 13px;border-radius:14px;max-width:88%;line-height:1.45}
.bubble.me{background:var(--bg);justify-self:end;border:1px solid var(--line)}
.bubble.ai{background:var(--navy);color:#fff}
.bubble.ai b{color:#9DB8FF}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi small{display:block;color:var(--muted);font-size:.72rem}
.kpi strong{font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.mrow{display:grid;grid-template-columns:1fr 70px 46px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.8rem}
.mrow:last-child{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.plan .pill,.card .pill,.region .pill{align-self:flex-start}
.pill.mint{background:var(--mint-soft);color:#0D7A60}
.pill.amber{background:var(--amber-soft);color:#8A5D05}
.pill.grey{background:#EEF1F6;color:var(--muted)}
.dark .pill{background:rgba(143,176,255,.16);color:#BFD0FF}
@media (max-width:640px){.mock-body{grid-template-columns:1fr}.mock-side{display:none}}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
@media (max-width:980px){.steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.step{border-top:2px solid var(--ink);padding-top:18px;display:grid;gap:10px}
.step .n{font-family:var(--f-display);font-size:.85rem;color:var(--accent);font-variant-numeric:tabular-nums}
.step p{color:var(--muted);font-size:.97rem}

/* Demo */
.demo{display:grid;grid-template-columns:320px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
@media (max-width:900px){.demo{grid-template-columns:1fr}}
.demo-src{background:var(--bg);border-right:1px solid var(--line);padding:24px;display:grid;gap:14px;align-content:start}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px}
.doc .ln{height:6px;border-radius:6px;background:#E4E9F2}
.doc-title{display:flex;gap:10px;align-items:center;font-weight:600;font-size:.95rem}
.doc-title .ic{color:var(--accent)}
.demo-out{padding:24px 28px;display:grid;gap:18px;align-content:start;min-height:420px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 .92rem var(--f-body);padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.formula{font-family:var(--f-display);font-size:1rem;padding:12px 16px;border-radius:12px;background:var(--accent-soft);color:var(--navy);display:inline-block}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.q-opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:500 .93rem var(--f-body);padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft);color:#0D6B54}
.opt.bad{border-color:#D9534F;background:#FDECEC;color:#9B2C2C}
.fb{font-size:.9rem;color:var(--muted)}
.empty{display:grid;place-items:center;text-align:center;gap:12px;color:var(--muted);padding:40px 10px;border:1.5px dashed var(--line);border-radius:16px}
.processing{display:flex;gap:10px;align-items:center;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Audience cards */
.aud{position:relative;border-radius:22px;padding:30px;min-height:260px;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--on-navy);background:linear-gradient(160deg,var(--navy-2),var(--navy));overflow:hidden;transition:transform .2s}
.aud:hover{transform:translateY(-3px)}
.aud::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(45,99,246,.55),transparent 70%)}
.aud .ic{width:34px;height:34px;color:#A9C2FF}
.aud p{color:var(--on-navy-muted);max-width:42ch}
.aud .go{margin-top:auto;display:flex;align-items:center;gap:8px;font-weight:600;color:#fff;position:relative;z-index:1}
.aud.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.aud.alt p{color:var(--muted)}
.aud.alt .ic{color:var(--accent)}
.aud.alt .go{color:var(--accent)}
.aud.alt::after{background:radial-gradient(circle,rgba(45,99,246,.12),transparent 70%)}

/* Feature list */
.feat{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:24px 0;border-bottom:1px solid var(--line)}
.feat:first-child{border-top:1px solid var(--line)}
.feat .num{font-family:var(--f-display);color:var(--accent);font-size:.9rem;padding-top:3px;font-variant-numeric:tabular-nums;min-width:32px}
.feat p{color:var(--muted);margin-top:6px}
.callout{border-radius:20px;padding:28px;background:var(--accent-soft);display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.callout .ic{color:var(--accent);width:30px;height:30px}
.callout.dark-c{background:var(--navy);color:var(--on-navy)}
.callout.dark-c p{color:var(--on-navy-muted)}

/* Pricing */
.price-tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);padding:6px;border-radius:999px;width:max-content;max-width:100%}
.stack > *{min-width:0}
@media (max-width:640px){.price-tabs{flex-wrap:nowrap;overflow-x:auto;width:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.price-tabs::-webkit-scrollbar{display:none}.price-tabs .tab{white-space:nowrap;flex:none}}
.price-tabs .tab{border:0}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px}
.plan.feature{background:var(--navy);color:var(--on-navy);border-color:var(--navy);box-shadow:0 30px 60px -30px rgba(10,24,54,.6)}
.plan.feature .muted,.plan.feature li{color:var(--on-navy-muted)}
.price{font-family:var(--f-display);font-size:2.4rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.price small{font-family:var(--f-body);font-size:.95rem;font-weight:500;color:var(--muted);letter-spacing:0}
.plan.feature .price small{color:var(--on-navy-muted)}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.plan li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:.96rem;color:var(--muted)}
.plan li .ic{width:18px;height:18px;color:var(--mint);margin-top:3px}
.plan .btn{margin-top:auto}
.plan.pick{position:relative;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.plan.pick:hover{transform:translateY(-4px);box-shadow:0 26px 50px -28px rgba(10,24,54,.45);border-color:var(--accent)}
.plan.pick.feature:hover{border-color:var(--navy)}
.plan.pick .tick{position:absolute;top:22px;right:22px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.plan.pick.feature .tick{background:var(--mint);border-color:var(--mint);color:#fff}
.plan.pick .tick .ic{width:16px;height:16px;stroke-width:2.4;color:#fff}
.plan.pick .pick-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-weight:600;color:var(--accent)}
.plan.pick.feature .pick-foot{border-color:rgba(255,255,255,.14);color:#fff}
.stack > .pill{justify-self:start}
.pack-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;align-items:center}
@media (max-width:900px){.pack-row{grid-template-columns:1fr}}
.pack-opts .plan.pick{padding:20px;gap:8px}
.pack-opts .plan.pick h3{font-size:.95rem!important;font-family:var(--f-body);font-weight:600}
.pack-opts .plan.pick .price{font-size:1.9rem}
.pack-opts .plan.pick .tick{top:16px;right:16px;width:24px;height:24px}
.pack-opts .plan.pick .pick-foot{padding-top:10px}
.pack-sel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.pick-sum{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 24px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:15px 20px;border-bottom:1px solid var(--line);font-size:.97rem}
th{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td strong{font-weight:600}
.note{font-size:.9rem;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.note .ic{width:18px;height:18px;margin-top:3px;color:var(--amber)}

/* Regions */
.route-line{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.region{border-radius:18px;padding:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);display:grid;gap:10px;transition:opacity .2s}
.region.dim{opacity:.28}
.region .stage{font-family:var(--f-display);font-size:.78rem;color:var(--on-navy-muted)}
.region h3{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend button{font:600 .86rem var(--f-body);padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--on-navy);cursor:pointer;display:flex;align-items:center;gap:8px}
.legend button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.sw{width:9px;height:9px;border-radius:50%}

    out = tabs + body;

  return `<div class="demo">

      <div class="card"><h3>${t('Додатково для закладів','Extras for institutions')}</h3><p>${t('Додаткові місця понад ліміт ліцензії, а також пакети Memory+ Education, Audio Education та Audio Tutor Education для всього закладу.','Extra seats beyond the licence limit, plus Memory+ Education, Audio Education and Audio Tutor Education packs for the whole institution.')}</p></div>

  </div></section>`;

  const from = gxView.slice(), t0 = performance.now(), dur = (instant||reduce) ? 0 : 900;

    gxView = from.map((v,j)=>v+(target[j]-v)*e);

  const g = document.getElementById('gx-glow'), h = WORLD.hubs[s.hubs[0]];

document.addEventListener('click', e => {

  const g = e.target.closest('[data-gx]'); if (g) { gxSet(+g.dataset.gx, true); return; }
  const sp = e.target.closest('[data-gx-step]'); if (sp) { gxSet(S.gstage + (+sp.dataset.gxStep), true); return; }
  if (e.target.closest('[data-gx-full]')) { S.gUser = true; gxSetView(FULL); }
});
document.addEventListener('mousemove', e => {
  const tip = document.getElementById('gx-tip'); if (!tip) return;
  const el = e.target.closest('#gx-map [data-st]');
  if (!el) { tip.hidden = true; return; }
  const s = GX()[+el.dataset.st], name = el.dataset.c ? gxName(el.dataset.c) : s.title;
  const r = document.getElementById('gx-map').getBoundingClientRect();
  tip.innerHTML = `<strong>${name}</strong><span>${t('Етап','Stage')} ${+el.dataset.st+1} · ${s.period}</span><span style="display:flex;gap:6px;align-items:center"><span class="sw" style="background:${REG_COL[s.s]}"></span>${REG_LABEL(s.s)}</span>`;
  tip.hidden = false;
  const x = Math.min(e.clientX - r.left + 14, r.width - 190), y = Math.max(e.clientY - r.top - 70, 8);
  tip.style.transform = `translate(${x}px, ${y}px)`;
});
let gxTouchX = null;
document.addEventListener('touchstart', e => { if (e.target.closest('#gx-panel')) gxTouchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => { if (gxTouchX===null) return; const dx = e.changedTouches[0].clientX - gxTouchX; gxTouchX = null; if (Math.abs(dx) > 50) gxSet(S.gstage + (dx<0?1:-1), true); }, {passive:true});
window.addEventListener('scroll', () => {
  if (currentRoute !== 'global' || S.gUser || !WORLD) return;
  const sec = document.getElementById('gx'); if (!sec) return;
  const r = sec.getBoundingClientRect(), vh = window.innerHeight;
  const p = (vh*0.45 - r.top) / (r.height*0.85);
  if (p < 0 || p > 1.2) return;
  gxSet(Math.floor(Math.min(.999, p) * GX().length), false);
}, {passive:true});

    ['key',t('Додатковий канал фінансування ліцензій','Extra licence funding channel'),t('Корпоративні партнери фінансують ліцензії для закладів, які потребують підтримки.','Corporate partners fund licences for institutions in need.')],
    ['globe',t('Міжнародна партнерська мережа','International partner network'),t('Співпраця з корпораціями, фондами та освітніми установами.','Work with corporations, foundations and institutions.')],
    ['shield',t('Репутація та довіра','Reputation and trust'),t('Прозорі програми формують довгострокові відносини із закладами й партнерами.','Transparent programmes build long-term relationships.')],
    ['grow',t('Масштабування впливу','Scaling impact'),t('Більше партнерів — більше закладів без фінансування всіх ліцензій лише за рахунок UniGO.','More partners mean more institutions without UniGO funding every licence itself.')]
  ])}
  <div class="callout dark-c mt" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)">${ic('info')}<p>${t('Благодійні надходження фонду обліковуватимуться окремо від комерційних доходів UniGO. Взаємодія фонду з компанією здійснюватиметься з дотриманням законодавства, принципів прозорості та запобігання конфліктам інтересів.','The fund’s charitable income will be accounted for separately from UniGO’s commercial revenue. Fund–company interaction will follow the law, transparency principles and conflict-of-interest safeguards.')}</p></div>
</div></section>

<section class="sec white"><div class="wrap">
  ${sectionHead(t('Міжнародний розвиток фонду','The fund’s international growth'), t('Від підтримки української освіти до міжнародних програм.','From supporting Ukrainian education to international programmes.'))}
  <div class="grid g3">${[
    ['first',t('Україна','Ukraine'),t('Формування благодійної моделі, партнерські програми та підтримка українських закладів.','Building the model, partner programmes and support for Ukrainian institutions.')],
    ['plan',t('Європейські партнерства','European partnerships'),t('Залучення міжнародних компаній до підтримки освіти в Україні та можливе розширення в Європі.','Bringing international companies to support education in Ukraine, with possible European expansion.')],
    ['future',t('Міжнародне масштабування','International scaling'),t('Співпраця з глобальними корпораціями та фондами для закладів у різних країнах.','Working with global corporations and foundations for institutions in many countries.')]
  ].map(([s,h,p],i)=>`<div class="card" style="border-top:3px solid ${REG_COL[s]};border-radius:0 0 18px 18px"><span class="muted" style="font-family:var(--f-display);font-size:.8rem">${t('Етап','Stage')} ${i+1}</span><h3 style="font-size:1.2rem">${h}</h3><p>${p}</p></div>`).join('')}</div>
  <p class="note mt">${ic('globe')}${t('Міжнародне розширення здійснюватиметься з урахуванням місцевого законодавства, освітніх потреб і можливостей фінансування.','International expansion will take local law, education needs and funding options into account.')}</p>
</div></section>

<section class="sec"><div class="wrap"><div class="stack" style="max-width:860px">
  <span class="eyebrow">${t('Довгострокове бачення','Long-term vision')}</span>
  <p class="big-quote">${t('Створюємо систему, у якій бізнес інвестує в освітні можливості.','Building a system where business invests in educational opportunity.')}</p>
  <p class="lead">${t('Кожна компанія зможе підтримати конкретний заклад, а кожна профінансована ліцензія матиме прозорий і вимірюваний результат. Наша мета — щоб фінансові обмеження не ставали перешкодою для доступу до сучасної освіти.','Every company will be able to support a specific institution, and every funded licence will have a transparent, measurable result. Our goal: money should never block access to modern education.')}</p>
</div></div></section>

${ctaBand(t('Разом відкриваємо нові можливості для освіти.','Together we open new opportunities for education.'), t('UniGO — технології для освіти. UniGO Foundation — можливості для кожного.','UniGO is technology for education. UniGO Foundation is opportunity for everyone.'), `<a class="btn btn-light" href="#contacts" data-cat="foundation">${t('Стати партнером фонду','Become a fund partner')}</a><a class="btn btn-outline-light" href="#contacts" data-cat="foundation">${t('Заявка від закладу','Institution application')}</a>`)}
<section class="sec-sm" style="padding-top:0"><div class="wrap"><p class="note">${ic('info')}${t('UniGO Foundation є запланованою благодійною ініціативою. Створення фонду, залучення благодійних внесків та запуск програм фінансування відбуватимуться після відповідного юридичного оформлення.','UniGO Foundation is a planned charitable initiative. The fund will be set up, and donations and funding programmes launched, only after the necessary legal registration.')}</p></div></section>`;
/* ---------- iPhone preview mode ---------- */
const IP_PAGES = () => [['home',t('Головна','Home')],['student-basic','Student Basic'],['addons',t('AI-пакети','AI packs')],['career','Career AI'],['teachers','UniGO Teacher'],['institutions','UniGO Education'],['employers','UniGO Employer'],['pricing',t('Тарифи','Pricing')],['global',t('Карта розвитку','Growth map')],['about',t('Про компанію','About')],['foundation','UniGO Foundation'],['faq','FAQ'],['contacts',t('Контакти','Contacts')]];
function renderIphone(){
  document.getElementById('hdr').innerHTML = ''; document.getElementById('ftr').innerHTML = ''; document.getElementById('mnav').innerHTML = '';
  document.body.classList.add('ip-mode');
  const base = location.href.split('#')[0];
  document.getElementById('app').innerHTML = `<div class="ip-wrap">
    <aside class="ip-side">
      <a class="logo" href="#home" style="color:#fff">${logoSvg}<span>Uni<b>GO</b></span></a>
      <div class="stack" style="gap:8px"><h1 style="font-size:1.6rem;color:#fff">${t('Перегляд на iPhone','iPhone preview')}</h1><p style="color:var(--on-navy-muted);font-size:.95rem">${t('Гортайте сайт у телефоні колесом миші або пальцем, натискайте на кнопки й меню, як на справжньому iPhone.','Scroll the site inside the phone with your mouse wheel or finger and tap buttons and menus as on a real iPhone.')}</p></div>
      <div class="ip-list">${IP_PAGES().map(([r,l])=>`<button data-ip="${r}" class="${r==='home'?'on':''}">${l}</button>`).join('')}</div>
      <a class="btn btn-outline-light btn-sm" href="#home" style="justify-self:start">← ${t('Повна версія сайту','Full website')}</a>
    </aside>
    <div class="ip-stage" id="ip-stage"><div class="ip-phone" id="ip-phone">
      <div class="ip-status"><span>9:41</span><i class="ip-island"></i><span class="ip-icons"><b></b><b></b><b></b><b></b><em></em></span></div>
      <iframe id="ipf" name="unigo-ip" title="UniGO iPhone" src="${base}#home"></iframe>
      <div class="ip-home"><i></i></div>
    </div></div>
  </div>`;
  ipFit();
}
function ipFit(){
  const ph = document.getElementById('ip-phone'), st = document.getElementById('ip-stage'); if (!ph || !st) return;
  const s = Math.min(1, (window.innerHeight - 40) / 880, (st.clientWidth - 20) / 421);
  ph.style.transform = `scale(${s})`; st.style.height = (880*s + 20) + 'px';
}
window.addEventListener('resize', () => { if (location.hash === '#iphone') ipFit(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ip]'); if (!b) return;
  const f = document.getElementById('ipf');
  try { f.contentWindow.location.hash = b.dataset.ip; } catch(_) { f.src = location.href.split('#')[0] + '#' + b.dataset.ip; }
  document.querySelectorAll('[data-ip]').forEach(x => x.classList.toggle('on', x === b));
});
/* ---------- render ---------- */
const TITLES = () => ({home:'UniGO',students:t('Учням і студентам','Students'),teachers:'UniGO Teacher',institutions:'UniGO Education',employers:'UniGO Employer',technology:t('Технології та ШІ','Technology & AI'),pricing:t('Тарифи','Pricing'),about:t('Про нас','About'),global:t('Міжнародний розвиток','Going global'),security:t('Безпека і довіра','Security'),partners:t('Партнерство','Partnerships'),faq:'FAQ',contacts:t('Контакти','Contacts'),foundation:'UniGO Foundation',career:'Career AI','student-basic':'Student Basic',addons:t('AI-пакети','AI packs'),'edu-education':'UniGO Education','edu-school':'UniGO School','edu-college':'UniGO College','edu-university':'UniGO University','edu-enterprise':'UniGO Enterprise Education'});
let currentRoute = null;
function render(keepScroll){
  const r = location.hash.slice(1);
  if (r === 'iphone' && window.name !== 'unigo-ip') { currentRoute = 'iphone'; renderIphone(); return; }
  document.body.classList.remove('ip-mode');
  const route = P[r] ? r : 'home';
  const changed = route !== currentRoute;
  currentRoute = route;
  document.documentElement.lang = lang === 'uk' ? 'uk' : 'en';
  renderHeader(route); renderFooter();
  const app = document.getElementById('app');
  app.innerHTML = `<div class="${changed?'view':''}">${P[route]()}</div>`;
  document.title = route === 'home' ? 'UniGO' : `${TITLES()[route]} · UniGO`;
  document.body.style.overflow = (route==='about' && S.aboutModal!=null) ? 'hidden' : '';
  if (route!=='about') S.aboutModal = null;
  closeMenus();
  drawDots();
  if (route==='global' && WORLD) { gxView = FULL.slice(); gxApply(true); }
  if (S.scroll) { const el = document.getElementById(S.scroll); S.scroll = null; if (el) { setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),30); return; } }
  if (changed && !keepScroll) window.scrollTo(0,0);
}
function refresh(){ const y = window.scrollY; render(true); window.scrollTo(0,y); }
function closeMenus(){ document.querySelectorAll('.nav-item.open').forEach(n=>{n.classList.remove('open'); n.querySelector('.nav-btn').setAttribute('aria-expanded','false');}); document.getElementById('mnav').classList.remove('open'); }

/* dotted globe-ish field */
function drawDots(){
  const c = document.getElementById('dots'); if (!c) return;
  const w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1;
  c.width = w*dpr; c.height = h*dpr; const x = c.getContext('2d'); x.scale(dpr,dpr);
  const gap = 14, cx = w/2, cy = h/2;
  const hubs = [ {x:.56,y:.42,c:REG_COL.first}, {x:.52,y:.36,c:REG_COL.plan}, {x:.47,y:.4,c:REG_COL.plan}, {x:.22,y:.4,c:REG_COL.plan}, {x:.76,y:.48,c:REG_COL.plan}, {x:.86,y:.78,c:REG_COL.future}, {x:.88,y:.4,c:REG_COL.future} ];
  for (let i=gap/2;i<w;i+=gap) for (let j=gap/2;j<h;j+=gap){
    const nx=(i-cx)/(w*.55), ny=(j-cy)/(h*.6);
    const land = Math.sin(nx*5.3+1.2)*Math.cos(ny*4.1-.4) + Math.sin(nx*2.1-ny*3.2) * .7;
    if (nx*nx+ny*ny>1.15 || land < .15) continue;
    x.fillStyle='rgba(169,194,255,.28)'; x.beginPath(); x.arc(i,j,1.6,0,7); x.fill();
  }
  const ua = hubs[0];
  hubs.forEach((p,k)=>{
    const px=p.x*w, py=p.y*h;
    if (k>0){ x.strokeStyle='rgba(143,176,255,.35)'; x.setLineDash([3,5]); x.beginPath(); x.moveTo(ua.x*w,ua.y*h); x.quadraticCurveTo((ua.x*w+px)/2,Math.min(ua.y*h,py)-40,px,py); x.stroke(); x.setLineDash([]); }
    x.fillStyle=p.c; x.globalAlpha=.25; x.beginPath(); x.arc(px,py,10,0,7); x.fill(); x.globalAlpha=1; x.beginPath(); x.arc(px,py,4,0,7); x.fill();
  });
}
window.addEventListener('resize', () => drawDots());

function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=>el.hidden=true, 4200); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tg = e.target.closest('button, a, [data-pick]');
  if (!tg) { if (e.target.classList && e.target.classList.contains('modal-bg')) { S.aboutModal = null; refresh(); return; } if (!e.target.closest('.nav-item')) closeMenus(); return; }
  if (tg.dataset.toggle){ const item = tg.closest('.nav-item'); const open = !item.classList.contains('open'); closeMenus(); if (open){ item.classList.add('open'); tg.setAttribute('aria-expanded','true'); } return; }
  if (tg.id === 'burger'){ const m = document.getElementById('mnav'); const o = !m.classList.contains('open'); m.classList.toggle('open', o); tg.setAttribute('aria-expanded', String(o)); return; }
  if (tg.dataset.lang){ lang = tg.dataset.lang; try{localStorage.setItem('unigo-lang',lang)}catch(_){} S.forms = {}; refresh(); return; }
  if ('login' in tg.dataset){ toast(t('Вхід до платформи відкриється з запуском UniGO. Поки що можна залишити заявку на сторінці «Контакти».','Platform login opens when UniGO launches. For now you can send a request on the Contacts page.')); return; }
  if (tg.dataset.ptabSwitch){ S.ptab = tg.dataset.ptabSwitch; refresh(); return; }
  if (tg.dataset.dtab){ S.dtab = tg.dataset.dtab; refresh(); return; }
  if ('demoRun' in tg.dataset){ S.demo = 1; refresh(); setTimeout(()=>{ S.demo = 2; S.dtab='exp'; if (currentRoute==='home') refresh(); }, 1300); return; }
  if ('demoReset' in tg.dataset){ S.demo = 0; S.ans = {}; S.dtab='exp'; refresh(); return; }
  if ('resetQuiz' in tg.dataset){ S.ans = {}; refresh(); return; }
  if (tg.dataset.q !== undefined){ S.ans[+tg.dataset.q] = +tg.dataset.o; refresh(); return; }
  if (tg.dataset.region){ S.region = tg.dataset.region; refresh(); return; }
  if (tg.dataset.faq !== undefined){ const i = +tg.dataset.faq; S.faq = S.faq === i ? -1 : i; refresh(); return; }
  if (tg.dataset.basic !== undefined){ S.hasBasic = tg.dataset.basic === '1'; refresh(); return; }
  if (tg.dataset.cfaq !== undefined){ const i = +tg.dataset.cfaq; S.cfaq = S.cfaq === i ? -1 : i; refresh(); return; }
  if ('careerBuy' in tg.dataset){ toast(t('Це демо-кнопка: оплата й підключення Career AI запрацюють із запуском платформи.','This is a demo button: payment and activation of Career AI will work once the platform launches.')); return; }
  if (tg.dataset.pick){ const [g,k] = tg.dataset.pick.split(':');
    if (g==='stu') S.b.m = k==='basic' ? 'none' : (S.b.m===k ? 'none' : k);
    if (g==='tch'){ if (k==='unl'){ if (S.tp.base==='inst'){ S.tp.base='public'; S.tp.unl=true; } else S.tp.unl=!S.tp.unl; } else { S.tp.base=k; if (k==='inst') S.tp.unl=false; } }
    if (g==='emp') S.emp = k;
    if (g==='fnd') S.fnd.p = k;
    if (g.startsWith('pk-')) { const pk = g.slice(3); S.b[pk] = S.b[pk] === +k ? -1 : +k; }
    refresh(); return; }
  if (tg.dataset.pfaq){ const [id,i] = tg.dataset.pfaq.split(':'); S.pfaq[id] = (S.pfaq[id] ?? 0) === +i ? -1 : +i; refresh(); return; }
  if (tg.dataset.bld){ const [k,v] = tg.dataset.bld.split(':'); S.b[k] = k==='m' ? v : k==='career' ? v==='true' : +v; refresh(); return; }
  if (tg.dataset.about !== undefined){ S.aboutModal = +tg.dataset.about; refresh(); setTimeout(()=>{ const m=document.querySelector('.modal'); m&&m.focus(); const b=document.querySelector('.modal-b'); if(b) b.scrollTop=0; },0); return; }
  if ('modalClose' in tg.dataset){ S.aboutModal = null; refresh(); return; }
  if (tg.dataset.fndShare){ S.fnd.share = +tg.dataset.fndShare; refresh(); return; }
  if (tg.dataset.empNeed !== undefined){ S.empNeed = +tg.dataset.empNeed; S.emp = ['Starter','Business','Enterprise','Enterprise'][S.empNeed]; refresh(); return; }
  if (tg.dataset.buy){ toast(t('Це демо-кнопка: оплата й підключення запрацюють із запуском платформи.','This is a demo button: payment and activation will work once the platform launches.')); return; }
  if (tg.dataset.partnerPick){ S.partner = tg.dataset.partnerPick; refresh(); return; }
  if (tg.tagName === 'A' && tg.getAttribute('href')?.startsWith('#')){
    if (tg.dataset.ptab) S.ptab = tg.dataset.ptab;
    if (tg.dataset.cat) S.cat = tg.dataset.cat;
    if (tg.dataset.partner) S.partner = tg.dataset.partner;
    if (tg.dataset.scroll) S.scroll = tg.dataset.scroll;
    S.forms = {};
    if (tg.getAttribute('href') === location.hash || (tg.getAttribute('href')==='#home' && !location.hash)){ e.preventDefault(); currentRoute = null; render(); }
    closeMenus();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenus(); if (S.aboutModal != null) { S.aboutModal = null; refresh(); } } const pk = e.target.closest && e.target.closest('[data-pick]'); if (pk && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); const key = pk.dataset.pick; pk.click(); setTimeout(()=>document.querySelector('[data-pick="'+key+'"]')?.focus(),0); } });
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const id = f.dataset.form;
  const bad = [...f.querySelectorAll('[required]')].filter(el => el.type==='checkbox' ? !el.checked : !el.value.trim() || (el.type==='email' && !/^\S+@\S+\.\S+$/.test(el.value)));
  if (bad.length){ S.forms[id] = { ok:false, text:t('Заповніть обовʼязкові поля, перевірте адресу пошти й підтвердьте згоду на обробку даних.','Fill in the required fields, check the email address and confirm consent to data processing.') }; }
  else { S.forms[id] = { ok:true, text:t('Форма заповнена правильно. Це демо-версія сайту: надсилання заявок буде підключено до CRM на етапі запуску, тож дані поки нікуди не передано.','The form is filled in correctly. This is a demo version of the site: sending requests will be connected to a CRM at launch, so no data has been sent yet.') }; }
  const vals = Object.fromEntries(new FormData(f));
  refresh();
  const nf = document.querySelector(`form[data-form="${id}"]`);
  if (nf && !S.forms[id].ok) Object.entries(vals).forEach(([k,v]) => { const el = nf.elements[k]; if (!el) return; if (el.type==='checkbox') el.checked = v==='on'; else el.value = v; });
  nf?.querySelector('.form-msg')?.scrollIntoView({block:'nearest'});
});
window.addEventListener('hashchange', () => render());
render();
</script>
</body>
</html>
